name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      # `npm test` (vitest --coverage) already fails this job if coverage drops
      # below the thresholds in vitest.config.js — this step just surfaces the
      # numbers on the PR. Runs even when the step above failed the gate.
      - name: Report coverage on PR
        if: always()
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const row = (k, label) => \`| \${label} | \${s[k].pct}% | \${s[k].covered}/\${s[k].total} |\`;
            console.log([
              '### Test coverage — epr-register-enrol-frontend',
              '| Metric | Coverage | Covered/Total |',
              '|---|---|---|',
              row('statements', 'Statements'),
              row('branches', 'Branches'),
              row('functions', 'Functions'),
              row('lines', 'Lines')
            ].join('\n'));
          " > /tmp/coverage-comment.md

      - name: Comment coverage on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: /tmp/coverage-comment.md

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag epr-register-enrol-frontend .
          exit $?

  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for matching e2e test branch
        id: e2e-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-fe-tests.git "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend docker image
        run: docker build -t defradigital/epr-register-enrol-frontend:${{ github.sha }} .

      - name: Check for matching backend branch
        id: be-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-backend.git "$BRANCH" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout and build matching backend
        if: steps.be-branch.outputs.exists == 'true'
        id: build-be
        run: |
          git clone --branch ${{ github.head_ref }} --depth 1 https://github.com/DEFRA/epr-register-enrol-backend.git _be
          cd _be
          SHA=$(git rev-parse --short HEAD)
          docker build -t defradigital/epr-register-enrol-backend:$SHA .
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Run e2e tests on ${{ steps.e2e-branch.outputs.ref }}
        uses: DEFRA/epr-register-enrol-fe-tests/run-journey-tests@main
        with:
          epr-register-enrol-fe: ${{ github.sha }}
          epr-register-enrol-be: ${{ steps.build-be.outputs.tag }}
          branch: ${{ steps.e2e-branch.outputs.ref }}

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.EPR_SONAR_TOKEN }}
